# 評価ケース（recall@k 用）。
# expect.pillars   : 上位 k 件の中に現れてほしい柱
# expect.sections  : 上位 k 件の見出しに含まれていてほしい文字列（大文字小文字は無視）
#
# 注意: これは最初の下書き（5件）です。sections は取り込み後の実際の見出しを
# `make search` で確認して調整してください。10〜20件に増やすことを想定しています。
- id: ec-site-availability-cost
  requirements: >-
    月間10万PVのECサイト。商品画像のアップロードあり。可用性を重視、予算は抑えたい。
  expect:
    pillars: [reliability, cost-optimization]

- id: internal-batch-security
  requirements: >-
    社内向けの夜間バッチ処理システム。個人情報を含むデータを扱うため、アクセス制御と暗号化を重視する。
  expect:
    pillars: [security, operational-excellence]

- id: serverless-api-spiky
  requirements: >-
    アクセスが不定期に急増するモバイルアプリ向けAPI。運用負荷は最小にしたい。サーバーレスで構成したい。
  expect:
    pillars: [performance-efficiency, operational-excellence]

- id: dr-requirement
  requirements: >-
    基幹システムの災害対策。RPO 15分、RTO 1時間以内で別リージョンに復旧できるようにしたい。
  expect:
    pillars: [reliability]
    sections: [backup]

- id: green-batch
  requirements: >-
    機械学習の学習ジョブを定期実行する。環境負荷とコストの両方を下げたい。
  expect:
    pillars: [sustainability, cost-optimization]
